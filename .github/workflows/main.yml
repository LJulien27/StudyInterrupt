name: Run Unit Tests

on:
  push:
    branches:
      - 'main'  # Triggers on push to main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # try repo root requirements, then Backend/requirements, otherwise install minimal test deps
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f Backend/requirements.txt ]; then
            pip install -r Backend/requirements.txt
          else
            pip install pytest fastapi[all] pymongo dnspython python-dotenv pytest-asyncio httpx
          fi

      - name: Run tests
        working-directory: Backend
        run: |
          pytest -q api_test.py
