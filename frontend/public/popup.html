<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <style>
            /* Reuse core colors from App.css */
            :root {
                --brand-deep: #044b4b; /* nav accent */
                --bg-dark: #282c34;   /* app header */
                --accent: #61dafb;    /* link/primary accent */
            }

            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; margin: 12px; width: 340px; background: #fff; color: #222; }
            .popup-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
            .logo { width:38px; height:38px; background:var(--brand-deep); border-radius:6px; display:inline-block; }
            .title { font-weight:700; color:var(--brand-deep); }
            .controls { display:flex; gap:8px; margin-bottom:8px; }
            button { padding:8px 10px; border-radius:6px; border:none; cursor:pointer; font-weight:600; }
            .primary { background:var(--brand-deep); color:#fff; }
            .accent { background:var(--accent); color:#052022; }
            .neutral { background:#f1f3f5; color:#111; }
            #content { margin-top:8px; }
            #status { margin-top:8px; color:#555; font-size:13px; }
        </style>
        <script src="popup.js" defer></script>
    </head>
    <body>
        <div class="popup-header">
            <div class="logo" aria-hidden="true"></div>
            <div>
                <div class="title">StudyBreak</div>
            </div>
        </div>

        <div class="controls">
            <button id="openWebApp" class="neutral">Open Web App</button>
            <button id="acceptInterrupt" class="primary" style="display:none">Accept the Interrupt</button>
            <button id="quitSession" class="neutral" style="display:none">Quit Session</button>
        </div>

        <div id="content"></div>
        <p id="status">Initializing…</p>
    </body>
</html>
