<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </head>
  <body>

    <nav class="navbar navbar-light bg-light">
      <a class="navbar-brand">StudyInterrupt</a>
      <form class="form-inline">
        <a href="#">Support</a>
        <a href="#">Resources</a>
        <a href="#">Settings</a>
      </form>
    </nav>

    <ul class="nav justify-content-center">
      <li class="nav-item">
        <a class="nav-link active" href="#">My Sessions</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="./history.html">Session History</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="./quiz.html">My Quiz Content</a>
      </li>
    </ul>

    <br>

    <div class="row">
      <div class="col-sm-3"></div>

      <div class="col-sm-6">

        <div class="card mx-auto text-center" style="width: 80%;">
          <div class="card-body">
            <h5 class="card-title">Active Session</h5>
            <br>
            <div class="row">
              <div class="col">
                <p class="card-text text-end">5 hours 34 minutes remaining</p>
              </div>
              <div class="col">
                <button class="btn btn-primary">STOP SESSION</button>
              </div>
            </div>
          </div>
        </div>

        <br><br>

        <div class="card mx-auto text-center" style="width: 80%;">
          <div class="card-body">
            <h5 class="card-title">Start Session</h5>
            <br>
            <div class="row">
              <div class="col">
                <input type="text" class="form-control" style="width: 120%;" />
              </div>
              <div class="col">
                <p class="card-text text-start">hours</p>
              </div>
              <div class="col">
                <input type="text" class="form-control" style="width: 120%;" />
              </div>
              <div class="col">
                <p class="card-text text-start">minutes</p>
              </div>
              <div class="col-lg-6">
                <button class="btn btn-primary" style="width: 57%;">START</button>
              </div>
            </div>

          </div>
        </div>

        <br><br>

        <div class="card mx-auto text-center" style="width: 80%;">
          <div class="card-body">
            <h5 class="card-title">My Blocklist</h5>
            <br>
            <div class="row">      
              <div class="col">
                <input type="text" class="form-control" style="width: 100%;"/>
              </div>
              <div class="col-sm-3">
                <button href="#" class="btn btn-primary">ADD SITE</button>
              </div>
            <div>

          </div>
        </div>

        
      </div>

      <div class="col-sm-3"></div>
    </div>

    
  </body>
</html>
